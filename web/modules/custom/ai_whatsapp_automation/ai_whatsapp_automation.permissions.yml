administer ai whatsapp automation:
  title: 'Administer AI WhatsApp Automation'
  description: 'Configure providers, AI options, storage, logs, and metrics for AI WhatsApp Automation.'
  restrict access: true

administer ai whatsapp automation entities:
  title: 'Administer AI WhatsApp Automation entities'
  description: 'Create, edit, view, and delete AI WhatsApp Automation records.'
  restrict access: true

view ai whatsapp automation dashboard:
  title: 'View AI WhatsApp Automation dashboard'
  description: 'View conversation, message, lead, token, and cost metrics.'

administer ai whatsapp automation rag:
  title: 'Administer AI WhatsApp Automation RAG'
  description: 'Manage knowledge bases, documents, chunks, and embeddings.'
  restrict access: true

administer ai whatsapp automation evolution:
  title: 'Administer AI WhatsApp Automation Evolution QR'
  description: 'Create Evolution API instances, generate QR codes, and manage QR connection status.'
  restrict access: true

access own client ai whatsapp records:
  title: 'View own client conversations, messages, leads and dashboard'
  description: 'For client users: only records of the client set on their user account. Costs are never shown.'

operate own client ai whatsapp conversations:
  title: 'Operate own client conversations and leads'
  description: 'For client users: reply, pause or reactivate the AI, close and assign conversations, and change lead status, only for their own client.'

# Section permissions. Each opens one area of the panel for every client.
# "administer ai whatsapp automation entities" keeps granting all of them.
administer ai whatsapp automation bots:
  title: 'Administer AI WhatsApp Automation bots'
  description: 'Create and edit bots (prompt, model, knowledge base) and their web chat integration, for every client.'
  restrict access: true

administer ai whatsapp automation accounts:
  title: 'Administer AI WhatsApp Automation WhatsApp accounts'
  description: 'Create and edit WhatsApp accounts (numbers and provider credentials), for every client.'
  restrict access: true

administer ai whatsapp automation routing:
  title: 'Administer AI WhatsApp Automation bot routing'
  description: 'Decide which bot answers on each WhatsApp account.'
  restrict access: true

view ai whatsapp automation operator log:
  title: 'View AI WhatsApp Automation operator log'
  description: 'See what human operators did on conversations (the operator log), without opening the conversations.'
