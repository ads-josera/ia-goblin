name: AI WhatsApp Automation
type: module
description: Provides the base configuration for WhatsApp automation with AI.
package: Custom
core_version_requirement: ^11
configure: ai_whatsapp_automation.settings
dependencies:
  - drupal:file
  # list_string fields and the options_select widget.
  - drupal:options
  - drupal:views
# Spanish interface strings ship with the module and are imported by
# `drush locale:check && drush locale:update` (part of every deployment).
'interface translation project': ai_whatsapp_automation
'interface translation server pattern': modules/custom/ai_whatsapp_automation/translations/%language.po
