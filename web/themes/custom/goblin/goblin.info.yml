name: Goblin
type: theme
'base theme': false
libraries:
  - goblin/base
  - goblin/messages
  - core/normalize
libraries-extend:
  user/drupal.user:
    - goblin/user
  core/drupal.dropbutton:
    - goblin/dropbutton
  core/drupal.dialog:
    - goblin/dialog
  file/drupal.file:
    - goblin/file
  core/drupal.item-list:
    - goblin/item-list
  core/drupal.progress:
    - goblin/progress
  core/drupal.tablesort:
    - goblin/drupal.tablesort
description: 'Tema del frontend de IA Goblin, con colores y marca configurables.'
core_version_requirement: ^11
generator: 'starterkit_theme:11.4.8'
